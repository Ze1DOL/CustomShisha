name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*' # Запускается только когда вы создаете тег версии (например, v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает роботу право создавать релизы
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: target/*.jar # Автоматически берет все .jar из папки target и прикрепляет к релизу
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
