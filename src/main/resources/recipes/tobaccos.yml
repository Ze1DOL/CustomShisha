# ==============================================================================
# 🚬 РУКОВОДСТВО ПО СОЗДАНИЮ СВОИХ РЕЦЕПТОВ ТАБАКА
# ==============================================================================
# Инструкция:
# 1. Скопируйте пустой шаблон ниже (от "template_tobacco:" до конца эффектов).
# 2. Измените название 'template_tobacco' на уникальное (например, 'apple_tobacco').
# 3. Настройте название (name) с помощью цветовых кодов параграфа (§).
# 4. В секции 'shape' (сетка верстака 3х3) задайте буквы для ингредиентов.
# 5. В 'ingredients' свяжите эти буквы с ID предметов Майнкрафта (только CAPS).
# 6. В 'effects' укажите нужные эффекты (STRENGTH, SPEED, REGENERATION и т.д.).
# ==============================================================================
# ПУСТОЙ ШАБЛОН ДЛЯ КОПИРОВАНИЯ (Просто скопируйте и вставьте ниже):
#  template_tobacco:
#    result:
#      material: "DYE_MATERIAL"         # ID красителя пачки (например, PURPLE_DYE)
#      name: "§d§lНазвание табака"      # Название пачки в игре
#      lore:
#        - "§7Используйте ПКМ по кальяну, чтобы заправить"
#        - "§7Аромат: Описание вкуса"   # Описание табака
#    shape:
#      - " I "                          # Верхний ряд верстака (I - ваш ингредиент)
#      - "SFP"                          # Средний ряд верстака (S, F, P - основа)
#    ingredients:
#      'I': "MINECRAFT_ITEM_ID"         # Ваш уникальный ингредиент
#      'S': "SUGAR"                     # Сахар (основа)
#      'F': "FEATHER"                   # Перо (основа)
#      'P': "PAPER"                     # Бумага (основа)
#    effects:
#      - type: "POTION_EFFECT"          # Эффект (например, LUCK, INCREASE_DAMAGE)
#        duration: 100                  # Длительность в тиках (20 тиков = 1 секунда)
#        amplifier: 0                   # Сила эффекта (0 = I уровень, 1 = II уровень)
# ==============================================================================
# ДЕЙСТВУЮЩИЕ РЕЦЕПТЫ СЕРВЕРА
# ==============================================================================

recipes:
  # 1. Ягодный табак (Сила)
  berry_tobacco:
    result:
      material: "GREEN_DYE"
      name: "§d§lПачка ягодного табака"
      lore:
        - "§7Используйте ПКМ по кальяну, чтобы заправить"
        - "§7Аромат: Насыщение и Сила"
    shape:
      - " B "
      - "SFP"
    ingredients:
      'B': "SWEET_BERRIES"
      'S': "SUGAR"
      'F': "FEATHER"
      'P': "PAPER"
    effects:
      - type: "STRENGTH"
        duration: 100
        amplifier: 0

  # 2. Мятный табак (Скорость)
  mint_tobacco:
    result:
      material: "LIME_DYE"
      name: "§a§lПачка мятного табака"
      lore:
        - "§7Используйте ПКМ по кальяну, чтобы заправить"
        - "§7Аромат: Бодрость и Скорость"
    shape:
      - " M "
      - "SFP"
    ingredients:
      'M': "CACTUS"
      'S': "SUGAR"
      'F': "FEATHER"
      'P': "PAPER"
    effects:
      - type: "SPEED"
        duration: 200
        amplifier: 0

  # 3. Яблочный табак (Прыгучесть)
  apple_tobacco:
    result:
      material: "RED_DYE"
      name: "§c§lПачка яблочного табака"
      lore:
        - "§7Используйте ПКМ по кальяну, чтобы заправить"
        - "§7Аромат: Легкость и Прыгучесть"
    shape:
      - " A "
      - "SFP"
    ingredients:
      'A': "APPLE"
      'S': "SUGAR"
      'F': "FEATHER"
      'P': "PAPER"
    effects:
      - type: "JUMP_BOOST"
        duration: 150
        amplifier: 1

  # 4. Кофейный табак (Спешка / Быстрая копка)
  coffee_tobacco:
    result:
      material: "BROWN_DYE"
      name: "§6§lПачка кофейного табака"
      lore:
        - "§7Используйте ПКМ по кальяну, чтобы заправить"
        - "§7Аромат: Энергия и Спешка"
    shape:
      - " C "
      - "SFP"
    ingredients:
      'C': "COCOA_BEANS"
      'S': "SUGAR"
      'F': "FEATHER"
      'P': "PAPER"
    effects:
      - type: "HASTE"
        duration: 200
        amplifier: 0

  # 5. Медовый табак (Огнестойкость)
  honey_tobacco:
    result:
      material: "ORANGE_DYE"
      name: "§e§lПачка медового табака"
      lore:
        - "§7Используйте ПКМ по кальяну, чтобы заправить"
        - "§7Аромат: Защита от пламени"
    shape:
      - " H "
      - "SFP"
    ingredients:
      'H': "HONEYCOMB"
      'S': "SUGAR"
      'F': "FEATHER"
      'P': "PAPER"
    effects:
      - type: "FIRE_RESISTANCE"
        duration: 300
        amplifier: 0